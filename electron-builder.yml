appId: com.cyrene.live2d
productName: Cyrene
directories:
  output: release
asar: true
asarUnpack:
  - "**/vendor/srt-win/**"
  - "**/node_modules/@ast-grep/**"
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - "!dist/components/**/*"
  - package.json
  - prompts/**/*
  - assets/**/*
  - skills/**/*
  - game-recipes/**/*
  - vendor/**/*
  - "!vendor/cloud-music-mcp/**/*"
  - "!models/**/*"
extraResources:
  - from: resources/bin/cyrene-screenshot.exe
    to: bin/cyrene-screenshot.exe
  - from: resources/bin/mpv
    to: bin/mpv
  - from: resources/mingit
    to: mingit
  - from: resources/components
    to: components
win:
  icon: assets/tray-icon.ico
  target:
    - nsis
nsis:
  artifactName: Cyrene-Setup-${version}.${ext}
  oneClick: false
  differentialPackage: false
  allowToChangeInstallationDirectory: true
  # Shortcut creation is controlled by the assisted install page below.
  createDesktopShortcut: false
  createStartMenuShortcut: true
  menuCategory: Cyrene
  include: build/installer/installer.nsh
  installerSidebar: build/installer/installer-sidebar.bmp
  uninstallerSidebar: build/installer/installer-sidebar.bmp

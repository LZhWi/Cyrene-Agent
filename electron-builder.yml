appId: com.cyrene.live2d
productName: Cyrene
directories:
  output: release
asar: true
asarUnpack:
  - "**/vendor/srt-win/**"
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - package.json
  - prompts/**/*
  - assets/**/*
  - skills/**/*
  - game-recipes/**/*
  - vendor/**/*
  - models/**/*
extraResources:
  - from: resources/bin/cyrene-screenshot.exe
    to: bin/cyrene-screenshot.exe
  - from: resources/mingit
    to: mingit
win:
  target:
    - dir

[package]
name = "cyrene-media"
version = "0.1.0"
edition = "2024"

# 通过 Windows SMTC（System Media Transport Controls）做后台媒体控制。
# 复用 screenshot helper 已经在用的 `windows` crate，因此同一套 mingw-w64
# GNU 工具链即可编译，不需要 MSVC。
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
] }

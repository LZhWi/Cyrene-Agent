[package]
name = "cyrene-media"
version = "0.1.0"
edition = "2024"

# Background media control via Windows SMTC (System Media Transport Controls).
# Same `windows` crate the screenshot helper already builds against, so this
# compiles under the same mingw-w64 GNU toolchain — no MSVC needed.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
] }

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene Work</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
</head>
<body>
  <div class="work-shell">
    <header class="titlebar">
      <div class="titlebar__meta">
        <div class="titlebar__brand">
          <button type="button" id="session-rail-toggle" class="brand-mark" aria-label="隐藏工作会话" aria-expanded="true" title="显示或隐藏工作会话">C</button>
          <strong>Cyrene Work</strong>
        </div>
        <span class="titlebar__separator" aria-hidden="true">·</span>
        <div class="titlebar__status" id="runtime-status"><span class="status-dot"></span>就绪</div>
      </div>
      <div class="titlebar__actions">
        <button id="memory-btn" class="title-action" title="Work 记忆">记忆</button>
        <button id="model-settings-btn" class="title-action" title="打开 Work 模型设置">模型设置</button>
        <button id="folder-btn" class="title-action" title="打开 Work 数据目录">目录</button>
        <button id="minimize-btn" class="window-action" aria-label="最小化">−</button>
        <button id="maximize-btn" class="window-action" aria-label="最大化">□</button>
        <button id="close-btn" class="window-action danger" aria-label="关闭">×</button>
      </div>
    </header>

    <aside class="session-rail" id="session-rail">
      <div class="rail-heading">
        <span>工作会话</span>
        <span class="rail-heading__hint">独立空间</span>
      </div>
      <button id="new-session-btn" class="primary full">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        新工作
      </button>
      <div class="session-list" id="session-list"></div>
    </aside>

    <main class="workspace">
      <section class="workspace__header">
        <div>
          <span class="workspace__eyebrow">WORKSPACE</span>
          <h1 id="session-title">新工作</h1>
          <p>独立历史 · 独立记忆 · 严格工作流</p>
        </div>
        <div class="model-picker"><span>模型调用选项请在“设置 → API 设置 → Work 模型”中管理</span></div>
      </section>

      <section class="content-grid">
        <div class="conversation-panel">
          <div class="messages" id="messages">
            <div class="empty-state" id="empty-state">
              <span class="empty-state__mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.7A2.5 2.5 0 0 1 4 13.5z" /></svg>
              </span>
              <strong>开始一项独立工作</strong>
              <span>这里不会读取聊天或主动消息的历史与记忆。</span>
            </div>
          </div>
          <div class="composer__file-tags" id="file-tags"></div>
          <form class="composer" id="composer">
            <input type="file" id="file-input" accept=".txt,.md,.markdown,.json,.csv,.tsv,.log,.xml,.yaml,.yml,.js,.mjs,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.cc,.h,.hpp,.rs,.go,.rb,.php,.sh,.bash,.css,.scss,.sql,.ini,.conf,.toml,.env,.svg,.html,.htm,.png,.jpg,.jpeg,.gif,.bmp,.webp" multiple hidden />
            <button type="button" id="attach-btn" class="composer__attach" aria-label="添加附件" title="添加附件">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 12.5 6.1-6.1a3.2 3.2 0 0 1 4.5 4.5l-8 8a5 5 0 0 1-7.1-7.1l8.2-8.2" /></svg>
            </button>
            <textarea id="work-input" rows="1" placeholder="描述要完成的工作… Enter 发送 / Shift+Enter 换行"></textarea>
            <button type="button" id="cancel-btn" class="composer__cancel" hidden>取消</button>
            <button type="submit" id="send-btn" class="composer__send" aria-label="执行">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8z" /><path d="M7 12h13" /></svg>
            </button>
          </form>
        </div>

        <aside class="execution-panel">
          <section class="panel-section">
            <div class="panel-heading"><h2>执行计划</h2><span>PLAN</span></div>
            <div id="plan-view" class="plan-view muted">尚未开始</div>
          </section>
          <section class="panel-section">
            <div class="panel-heading"><h2>活动</h2><span>ACTIVITY</span></div>
            <div id="activity-view" class="activity-view muted">暂无活动</div>
          </section>
          <section class="panel-section">
            <div class="panel-heading"><h2>产物</h2><span>ARTIFACTS</span></div>
            <div id="artifact-view" class="artifact-view muted">暂无产物</div>
          </section>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="memory-dialog">
    <div class="dialog-header">
      <div><h2>Work 专用记忆</h2><p>这些内容不会进入 Chat、Collab 或 Proactive。</p></div>
      <button id="memory-close-btn" aria-label="关闭">×</button>
    </div>
    <div id="memory-list" class="memory-list"></div>
  </dialog>

  <script type="module" src="./main.ts"></script>
</body>
</html>

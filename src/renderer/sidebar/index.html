<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>昔涟 · 状态</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="stylesheet" href="../ui/fonts.css" />
  <link rel="stylesheet" href="../ui/base.css" />
  <link rel="stylesheet" href="./sidebar.css" />
</head>
<body>
  <div class="sidebar">
    <header class="sidebar__titlebar">
      <button type="button" class="sidebar__icon-btn" id="pin-btn" aria-label="置顶" title="置顶"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 6 6-2 2 3 5-1 1-5-3-2 2-1-1 2-2-3-5zM8 16l-4 4" /></svg></button>
      <div class="sidebar__title">
        <span class="sidebar__name">昔涟</span>
        <span class="sidebar__hint">状态面板</span>
      </div>
      <div class="sidebar__titlebar-actions">
        <button type="button" class="sidebar__winbtn" id="min-btn" aria-label="最小化" title="最小化">
          <svg width="9" height="2" viewBox="0 0 9 2" aria-hidden="true"><rect width="9" height="2" rx="1" fill="currentColor"/></svg>
        </button>
        <button type="button" class="sidebar__winbtn sidebar__winbtn--close" id="close-btn" aria-label="关闭" title="关闭">
          <svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true">
            <line x1="2" y1="2" x2="7" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="7" y1="2" x2="2" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="sidebar__body">
      <section class="profile">
        <img class="profile__avatar" src="/avatars/cyrene-avatar.png" alt="昔涟" draggable="false" />
        <div class="profile__name">昔涟</div>
        <div class="profile__online">
          <span class="profile__dot" aria-hidden="true"></span>
          <span id="online-status-label">在线</span>
        </div>
      </section>

      <hr class="sidebar__divider" />

      <section class="panel-card panel-card--status">
        <div class="indicator">
          <div class="indicator__emoji" id="status-emoji">✨</div>
          <div class="indicator__text">
            <span class="indicator__prefix">状态：</span>
            <span class="indicator__label" id="status-label">元气</span>
          </div>
        </div>
      </section>

      <section class="panel-card panel-card--feeling">
        <div class="indicator">
          <div class="indicator__emoji" id="feeling-emoji">🥰</div>
          <div class="indicator__text">
            <span class="indicator__prefix">心情：</span>
            <span class="indicator__label" id="feeling-label">开心</span>
          </div>
        </div>
      </section>

      <section class="panel-card model-card">
        <div class="model-feed">
          <span class="model-feed__emoji" aria-hidden="true">🍰</span>
          <span>正在喂养：</span>
          <span class="model-feed__name" id="feeding-model">DeepSeek Chat</span>
        </div>
        <button type="button" class="model-switch-btn" id="open-chat-btn" title="打开聊天">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.7A2.5 2.5 0 0 1 4 13.5z" /></svg>
          <span>打开聊天</span>
        </button>
        <button type="button" class="model-switch-btn" id="open-work-btn" title="打开独立 Work 工作台">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h6M9 3h6v4H9zM7 5H5v16h14V5h-2M8 12h8M8 16h5" /></svg>
          <span>Work</span>
        </button>
        <button type="button" class="model-switch-btn" id="call-btn" title="语音通话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3 4 5c.6 7.6 6.4 13.4 14 14l2-3-4-3-2 2c-2.2-.8-4.2-2.8-5-5l2-2z" /></svg>
          <span>语音通话</span>
        </button>
        <button type="button" class="model-switch-btn" id="model-switch-btn" title="打开 Game Bot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h8a5 5 0 0 1 4.8 6.4l-1.2 4A2.3 2.3 0 0 1 15.8 18l-1.5-1.5H9.7L8.2 18a2.3 2.3 0 0 1-3.8-.6l-1.2-4A5 5 0 0 1 8 7Zm1.5 3v4M7.5 12h4M16.5 11.5h.01M18.5 13.5h.01" /></svg>
          <span>Game Bot</span>
        </button>
      </section>

      <section class="panel-card action-card">
        <button type="button" class="settings-btn" id="settings-btn" title="打开设置">
          <svg class="settings-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM19 12l2-1-2-4-2 .5-1.5-1L15 4h-6l-.5 2.5-1.5 1L5 7l-2 4 2 1v2l-2 1 2 4 2-.5 1.5 1L9 22h6l.5-2.5 1.5-1 2 .5 2-4-2-1z" /></svg>
          <span class="settings-btn__text">设置</span>
        </button>
      </section>

      <hr class="sidebar__divider" />

      <div class="sidebar__version">昔涟 v0.3.0</div>
    </main>
  </div>
  <script type="module" src="./sidebar.ts"></script>
</body>
</html>

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test src/main
        run: npx vitest run --reporter=verbose src/main

      - name: Test src/renderer
        run: npx vitest run --reporter=verbose src/renderer

      - name: Test src/shared + src/cli
        run: npx vitest run --reporter=verbose src/shared src/cli

      - name: Test skills
        run: npx vitest run --reporter=verbose skills

      - name: Test scripts/cline-poc
        run: npx vitest run --reporter=verbose scripts/cline-poc